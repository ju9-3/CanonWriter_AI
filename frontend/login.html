<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | CanonWriter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            main: '#7A4B3A',
            darkMain: '#D4836B',
            pageBg: '#F7F7F5',
            darkBg: '#1A1A1A',
            cardDark: '#292929'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .input-base {
        @apply w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 outline-none transition focus:border-main dark:border-gray-600 dark:bg-cardDark dark:text-white dark:focus:border-darkMain;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function LoginPage() {
  const [dark, setDark] = useState(localStorage.getItem('dark') === '1');
  const [account, setAccount] = useState('');
  const [pwd, setPwd] = useState('');

  useEffect(() => {
    if (dark) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
    localStorage.setItem('dark', dark ? '1' : '0');
  }, [dark]);

  // 登录成功跳书架
  function handleLogin() {
    if (!account || !pwd) {
      alert('账号和密码不能为空');
      return;
    }
    localStorage.setItem('loggedIn', '1');
    location.href = 'dashboard.html';
  }

  return (
    <div className={`min-h-screen flex flex-col bg-pageBg dark:bg-darkBg text-[#1C1C1C] dark:text-white transition-colors`}>
      <header className="mx-auto w-full max-w-6xl flex items-center justify-between px-5 py-5 sm:px-8">
        <a href="index.html" className="text-[20px] font-bold text-[#1C1C1C] dark:text-white">CanonWriter</a>
        <button onClick={()=>setDark(!dark)} className="text-xl">
          {dark ? '☀️' : '🌙'}
        </button>
      </header>

      <main className="flex-1 flex items-center justify-center px-4">
        <div className="w-full max-w-md rounded-xl bg-white dark:bg-cardDark p-7 shadow-md">
          <h2 className="text-[26px] font-bold text-center mb-6">账号登录</h2>

          <div className="space-y-4">
            <div>
              <label className="block mb-1.5 text-sm">账号</label>
              <input value={account} onChange={e=>setAccount(e.target.value)} className="input-base" placeholder="输入账号" />
            </div>
            <div>
              <label className="block mb-1.5 text-sm">密码</label>
              <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} className="input-base" placeholder="输入密码" />
            </div>

            <button onClick={handleLogin} className="w-full rounded-lg bg-main hover:bg-[#684030] dark:bg-darkMain dark:hover:bg-[#e2977c] py-2.5 text-white font-medium transition-colors mt-2">
              登录
            </button>
          </div>

          <p className="text-center mt-5 text-sm text-gray-500 dark:text-gray-400">
            没有账号？
            <a href="register.html" className="text-main dark:text-darkMain ml-1 hover:underline">前往注册</a>
          </p>
        </div>
      </main>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage/>)
</script>
</body>
</html>
