<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanonWriter — 人与 AI，共铸史诗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FEATURES = [
      {
        id: "worldbook",
        title: "动态世界观库",
        description: "一键上传人物志与大纲，AI 自动解析关联。"
      },
      {
        id: "memory",
        title: "设定级 AI 记忆",
        description: "百万字连载不吃书，AI 实时核对设定冲突。"
      },
      {
        id: "narrative",
        title: "叙事推演引擎",
        description: "支持世界观检索、人物时间线、事件情绪曲线，AI 生成、审核与重优化小说文本。"
      }
    ];

    const SLIDES = [
      { id: "worldbook", image: "images/slide3.jpg", alt: "动态世界观库" },
      { id: "memory", image: "images/slide2.jpg", alt: "设定级 AI 记忆" },
      { id: "narrative", image: "images/slide1.jpg", alt: "叙事推演引擎" }
    ];

    const AUTOPLAY_MS = 4500;

    function App() {
      const [activeIndex, setActiveIndex] = useState(0);
      const [isForward, setIsForward] = useState(true);
      const [isPaused, setIsPaused] = useState(false);
      const total = SLIDES.length;

      // 已登录则直接进书架
      useEffect(() => {
        if (localStorage.getItem('loggedIn') === '1') {
          // 不自动跳转，让用户自己选择
        }
      }, []);

      useEffect(() => {
        if (isPaused) return;

        const timer = setTimeout(() => {
          const next = activeIndex + (isForward ? 1 : -1);

          if (next >= total) {
            setIsForward(false);
            setActiveIndex(total - 2);
          } else if (next < 0) {
            setIsForward(true);
            setActiveIndex(1);
          } else {
            setActiveIndex(next);
          }
        }, AUTOPLAY_MS);

        return () => clearTimeout(timer);
      }, [activeIndex, isForward, isPaused, total]);

      const goNext = () => {
        setIsForward(true);
        setActiveIndex((activeIndex + 1) % total);
      };

      const goPrev = () => {
        setIsForward(false);
        setActiveIndex((activeIndex - 1 + total) % total);
      };

      const goTo = (index) => {
        setIsForward(index > activeIndex);
        setActiveIndex(index);
      };

      // 已登录时"开始创作"直接进书架
      const startHref = localStorage.getItem('loggedIn') === '1' ? 'dashboard.html' : 'login.html';

      return (
  <div className="min-h-screen bg-[#F7F7F5] text-[#1C1C1C]">
    <header className="mx-auto flex max-w-6xl items-center justify-between px-5 py-5 sm:px-8">
      <a href="index.html" className="text-[20px] font-bold text-[#1C1C1C]">
        CanonWriter
      </a>

      <div className="flex items-center gap-4 sm:gap-6">
        <a href="login.html" className="text-sm text-[#666666] transition-colors hover:text-[#1C1C1C]">
          登录
        </a>
        <a href="register.html" className="text-sm text-[#666666] transition-colors hover:text-[#1C1C1C]">
          注册
        </a>
        <a href={startHref}>
          <button
            type="button"
            className="rounded-lg bg-[#1C1C1C] px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[#333333]"
          >
            开始创作
          </button>
        </a>
      </div>
    </header>
    
          <main className="pb-20">
            <section className="mx-auto max-w-4xl px-6 pt-16 pb-12 text-center sm:pt-24 sm:pb-16">
              <h1 className="text-[48px] leading-[1.2] font-bold text-[#1C1C1C]">
                人与 AI，共铸史诗
              </h1>
              <p className="mt-4 text-[28px] font-medium leading-relaxed text-[#B89588] opacity-80">
                去创作！去想象！去改写！
              </p>
            </section>

            <section className="mx-auto max-w-5xl px-4 sm:px-6">
              <div className="grid gap-10 rounded-3xl bg-white p-6 shadow-sm sm:p-10 lg:grid-cols-[4fr_6fr] lg:gap-14 lg:p-14">
                <div className="space-y-10 py-2 lg:py-6">
                  {FEATURES.map((feature) => (
                    <article key={feature.id} className="border-l-[3px] border-[#7A4B3A] pl-6">
                      <h2 className="text-xl font-semibold text-[#7A4B3A]">
                        {feature.title}
                      </h2>
                      <p className="mt-2 text-[15px] leading-relaxed text-[#1C1C1C]">
                        {feature.description}
                      </p>
                    </article>
                  ))}
                </div>

                <div
                  role="region"
                  aria-roledescription="carousel"
                  aria-label="CanonWriter 功能插画轮播"
                  className="relative min-h-[320px] overflow-hidden rounded-2xl bg-white sm:min-h-[360px] shadow-inner"
                  onMouseEnter={() => setIsPaused(true)}
                  onMouseLeave={() => setIsPaused(false)}
                >
                  {SLIDES.map((slide, index) => {
                    const isActive = index === activeIndex;

                    return (
                      <div
                        key={slide.id}
                        aria-hidden={!isActive}
                        className={`absolute inset-0 flex items-center justify-center p-8 transition-all duration-700 ease-in-out sm:p-10 ${
                          isActive
                            ? "translate-x-0 scale-100 opacity-100"
                            : "pointer-events-none translate-x-6 scale-[0.98] opacity-0"
                        }`}
                      >
                        {slide.image ? (
                          <img
                            src={slide.image}
                            alt={slide.alt}
                            className="h-full w-full rounded-xl object-cover"
                            style={{ objectPosition: 'center top' }}
                          />
                        ) : (
                          <PlaceholderArt variant={slide.id} label={slide.alt} />
                        )}
                      </div>
                    );
                  })}

                  <div className="pointer-events-none absolute inset-x-0 top-1/2 flex -translate-y-1/2 items-center justify-between px-3 sm:px-5">
                    <CarouselButton onClick={goPrev} label="上一张">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6" />
                      </svg>
                    </CarouselButton>
                    <CarouselButton onClick={goNext} label="下一张">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </CarouselButton>
                  </div>

                  <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-2">
                    {SLIDES.map((slide, index) => (
                      <button
                        key={slide.id}
                        type="button"
                        onClick={() => goTo(index)}
                        aria-label={`切换到第 ${index + 1} 张`}
                        className={`h-2 rounded-full transition-all duration-300 ${
                          index === activeIndex
                            ? "w-6 bg-[#7A4B3A]"
                            : "w-2 bg-[#D8D2CC]"
                        }`}
                      />
                    ))}
                  </div>

                  <div className="absolute top-4 right-4 rounded-full bg-white/85 px-3 py-1 text-xs font-medium text-[#666666] shadow-sm">
                    {String(activeIndex + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}
                  </div>
                </div>
              </div>
            </section>
          </main>
        </div>
      );
    }

    function CarouselButton({ onClick, label, children }) {
      return (
        <button
          type="button"
          onClick={onClick}
          aria-label={label}
          className="pointer-events-auto flex h-9 w-9 items-center justify-center rounded-full bg-white text-[#7A4B3A] shadow-sm transition-transform duration-300 hover:scale-105 hover:bg-[#7A4B3A] hover:text-white"
        >
          {children}
        </button>
      );
    }

    function PlaceholderArt({ variant, label }) {
      const bg = variant === "memory" ? "#FFF8F0" : variant === "collaboration" ? "#F5F7FF" : "#FAF5FF";
      const accent2 = variant === "memory" ? "#A0624E" : variant === "collaboration" ? "#6B5B95" : "#8B6BB1";

      return (
        <svg viewBox="0 0 480 360" fill="none" role="img" aria-label={label} className="h-full w-full">
          <defs>
            <linearGradient id={`bg-${variant}`} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor={bg} />
              <stop offset="100%" stopColor="#FFFFFF" />
            </linearGradient>
            <radialGradient id={`glow-${variant}`} cx="50%" cy="45%" r="40%">
              <stop offset="0%" stopColor="#7A4B3A" stopOpacity="0.1" />
              <stop offset="100%" stopColor="#7A4B3A" stopOpacity="0" />
            </radialGradient>
            <linearGradient id={`fill-${variant}`} x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stopColor="#7A4B3A" stopOpacity="0.15" />
              <stop offset="100%" stopColor="#7A4B3A" stopOpacity="0.03" />
            </linearGradient>
            <linearGradient id={`accent-${variant}`} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#7A4B3A" />
              <stop offset="100%" stopColor={accent2} />
            </linearGradient>
          </defs>
          <rect width="480" height="360" fill={`url(#bg-${variant})`} />
          <circle cx="240" cy="165" r="130" fill={`url(#glow-${variant})`} />
          {variant === "memory" && <MemoryArt />}
          {variant === "collaboration" && <CollaborationArt />}
          {variant === "worldbook" && <WorldbookArt />}
        </svg>
      );
    }

    function MemoryArt() {
      const nodes = [
        [240, 70], [175, 130], [305, 130], [145, 190], [335, 190],
        [175, 250], [305, 250], [240, 290], [210, 100], [270, 100],
        [200, 170], [280, 170], [220, 220], [260, 220]
      ];
      const links = [
        [0, 8], [0, 9], [8, 1], [9, 2], [1, 10], [2, 11],
        [10, 3], [11, 4], [3, 12], [4, 13], [12, 6], [13, 5],
        [6, 7], [5, 7], [1, 2], [3, 4], [10, 11], [12, 13], [8, 9], [6, 5]
      ];

      return (
        <>
          {/* 大脑左半球 */}
          <path
            d="M240 65 C 195 65, 160 100, 160 145 C 140 150, 125 175, 130 200 C 115 210, 115 240, 135 255 C 140 280, 165 295, 195 290 C 210 300, 230 302, 240 298 L 240 65 Z"
            fill="url(#fill-memory)"
            stroke="url(#accent-memory)"
            strokeWidth="2"
          />
          {/* 大脑右半球 */}
          <path
            d="M240 65 C 285 65, 320 100, 320 145 C 340 150, 355 175, 350 200 C 365 210, 365 240, 345 255 C 340 280, 315 295, 285 290 C 270 300, 250 302, 240 298 L 240 65 Z"
            fill="url(#fill-memory)"
            stroke="url(#accent-memory)"
            strokeWidth="2"
          />

          {/* 脑沟回纹路 */}
          <path d="M240 85 C 220 95, 215 115, 225 130 M240 85 C 260 95, 265 115, 255 130 M230 145 C 210 155, 205 175, 215 190 M250 145 C 270 155, 275 175, 265 190 M225 205 C 210 215, 205 235, 220 248 M255 205 C 270 215, 275 235, 260 248"
            stroke="#7A4B3A" strokeWidth="1.2" strokeLinecap="round" fill="none" opacity="0.35" />

          {/* 神经连接线 */}
          {links.map((link, i) => (
            <line key={`link-${i}`} x1={nodes[link[0]][0]} y1={nodes[link[0]][1]}
              x2={nodes[link[1]][0]} y2={nodes[link[1]][1]}
              stroke="#7A4B3A" strokeWidth="1" opacity="0.2" />
          ))}

          {/* 神经节点 */}
          {nodes.map((node, i) => (
            <g key={`node-${i}`}>
              <circle cx={node[0]} cy={node[1]} r="8" fill="#7A4B3A" opacity="0.1" />
              <circle cx={node[0]} cy={node[1]} r="4" fill="url(#accent-memory)" />
              <circle cx={node[0]} cy={node[1]} r="1.5" fill="#fff" />
            </g>
          ))}

          {/* 顶部信号灯 */}
          <circle cx="240" cy="50" r="5" fill="#7A4B3A" />
          <circle cx="240" cy="50" r="10" fill="#7A4B3A" opacity="0.15" />
          <path d="M240 55 V 65" stroke="#7A4B3A" strokeWidth="1.5" strokeLinecap="round" />

          {/* 装饰粒子 */}
          {[[80, 100], [400, 110], [70, 250], [410, 260], [100, 320], [380, 320], [60, 180], [420, 180]].map((pos, i) => (
            <circle key={`p-${i}`} cx={pos[0]} cy={pos[1]} r="1.5" fill="#7A4B3A" opacity="0.3" />
          ))}

          {/* 底部标签 */}
          <rect x="185" y="322" width="110" height="22" rx="11" fill="#7A4B3A" opacity="0.08" />
          <text x="240" y="336" textAnchor="middle" fontSize="10" fill="#7A4B3A" opacity="0.55" fontWeight="600">
            MEMORY CORE
          </text>
        </>
      );
    }

    function CollaborationArt() {
      return (
        <>
          {/* 中心光环 */}
          <circle cx="240" cy="165" r="48" fill="#7A4B3A" opacity="0.05" />
          <circle cx="240" cy="165" r="32" fill="#7A4B3A" opacity="0.08" />

          {/* 中心文档 */}
          <rect x="222" y="142" width="36" height="46" rx="4" fill="url(#fill-collaboration)" stroke="url(#accent-collaboration)" strokeWidth="2" />
          <line x1="230" y1="155" x2="250" y2="155" stroke="#7A4B3A" strokeWidth="1.5" opacity="0.4" />
          <line x1="230" y1="163" x2="250" y2="163" stroke="#7A4B3A" strokeWidth="1.5" opacity="0.4" />
          <line x1="230" y1="171" x2="244" y2="171" stroke="#7A4B3A" strokeWidth="1.5" opacity="0.4" />
          <line x1="230" y1="179" x2="250" y2="179" stroke="#7A4B3A" strokeWidth="1.5" opacity="0.4" />

          {/* 笔 */}
          <path d="M258 136 L268 126 L272 130 L262 140 Z" fill="url(#accent-collaboration)" />
          <path d="M262 140 L258 144 L256 142 L258 136 Z" fill="#7A4B3A" opacity="0.5" />

          {/* 顶部人物 */}
          <circle cx="240" cy="72" r="17" fill="url(#fill-collaboration)" stroke="url(#accent-collaboration)" strokeWidth="2" />
          <circle cx="240" cy="65" r="5.5" fill="#7A4B3A" opacity="0.5" />
          <path d="M227 85 Q240 75 253 85" stroke="#7A4B3A" strokeWidth="2" fill="none" opacity="0.35" />
          <line x1="240" y1="89" x2="240" y2="142" stroke="#7A4B3A" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.35" />
          <circle cx="240" cy="115" r="3" fill="#7A4B3A" opacity="0.4" />

          {/* 左下人物 */}
          <circle cx="125" cy="240" r="17" fill="url(#fill-collaboration)" stroke="url(#accent-collaboration)" strokeWidth="2" />
          <circle cx="125" cy="233" r="5.5" fill="#7A4B3A" opacity="0.5" />
          <path d="M112 253 Q125 243 138 253" stroke="#7A4B3A" strokeWidth="2" fill="none" opacity="0.35" />
          <line x1="142" y1="240" x2="222" y2="172" stroke="#7A4B3A" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.35" />
          <circle cx="182" cy="206" r="3" fill="#7A4B3A" opacity="0.4" />

          {/* 右下人物 */}
          <circle cx="355" cy="240" r="17" fill="url(#fill-collaboration)" stroke="url(#accent-collaboration)" strokeWidth="2" />
          <circle cx="355" cy="233" r="5.5" fill="#7A4B3A" opacity="0.5" />
          <path d="M342 253 Q355 243 368 253" stroke="#7A4B3A" strokeWidth="2" fill="none" opacity="0.35" />
          <line x1="338" y1="240" x2="258" y2="172" stroke="#7A4B3A" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.35" />
          <circle cx="298" cy="206" r="3" fill="#7A4B3A" opacity="0.4" />

          {/* 底部协作图标 */}
          {[[125, 275], [355, 275]].map((pos, i) => (
            <g key={`icon-${i}`} transform={`translate(${pos[0]}, ${pos[1]})`}>
              <rect x="-20" y="0" width="40" height="24" rx="4" fill="#7A4B3A" opacity="0.07" />
              <circle cx="-7" cy="12" r="3" fill="#7A4B3A" opacity="0.4" />
              <circle cx="7" cy="12" r="3" fill="#7A4B3A" opacity="0.4" />
              <path d="M-4 12 H 4" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" />
            </g>
          ))}

          {/* 装饰粒子 */}
          {[[60, 120], [420, 130], [80, 310], [400, 310], [240, 25], [170, 50], [310, 50]].map((pos, i) => (
            <circle key={`p-${i}`} cx={pos[0]} cy={pos[1]} r="1.5" fill="#7A4B3A" opacity="0.25" />
          ))}

          {/* 底部标签 */}
          <rect x="175" y="322" width="130" height="22" rx="11" fill="#7A4B3A" opacity="0.08" />
          <text x="240" y="336" textAnchor="middle" fontSize="10" fill="#7A4B3A" opacity="0.55" fontWeight="600">
            REAL-TIME SYNC
          </text>
        </>
      );
    }

    function WorldbookArt() {
      return (
        <>
          {/* 顶部数据库 */}
          <ellipse cx="320" cy="100" rx="42" ry="13" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <path d="M278 100 V 145 A42 13 0 0 0 362 145 V 100" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <ellipse cx="320" cy="100" rx="42" ry="13" fill="none" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <path d="M278 120 A42 13 0 0 0 362 120" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" fill="none" />
          <path d="M278 132 A42 13 0 0 0 362 132" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" fill="none" />
          <circle cx="320" cy="100" r="3.5" fill="#7A4B3A" />
          <circle cx="300" cy="100" r="2" fill="#7A4B3A" opacity="0.5" />
          <circle cx="340" cy="100" r="2" fill="#7A4B3A" opacity="0.5" />

          {/* 堆叠书籍 - 底书 */}
          <rect x="95" y="230" width="150" height="30" rx="5" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <line x1="105" y1="245" x2="235" y2="245" stroke="#7A4B3A" strokeWidth="1" opacity="0.15" />
          <rect x="105" y="238" width="22" height="14" rx="2" fill="#7A4B3A" opacity="0.12" />

          {/* 中书 */}
          <rect x="110" y="198" width="130" height="30" rx="5" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <line x1="120" y1="213" x2="230" y2="213" stroke="#7A4B3A" strokeWidth="1" opacity="0.15" />
          <rect x="120" y="206" width="22" height="14" rx="2" fill="#7A4B3A" opacity="0.12" />

          {/* 顶书（打开的书） */}
          <path d="M125 168 L125 195 L190 200 L190 173 Z" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <path d="M190 173 L190 200 L255 195 L255 168 Z" fill="url(#fill-worldbook)" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <path d="M190 173 L190 200" stroke="url(#accent-worldbook)" strokeWidth="2" />
          <line x1="135" y1="178" x2="180" y2="182" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" />
          <line x1="135" y1="185" x2="175" y2="188" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" />
          <line x1="200" y1="182" x2="245" y2="178" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" />
          <line x1="200" y1="188" x2="240" y2="185" stroke="#7A4B3A" strokeWidth="1" opacity="0.25" />

          {/* 关联线：书 → 数据库 */}
          <path d="M255 185 Q 285 150, 300 118" stroke="#7A4B3A" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.3" fill="none" />
          <circle cx="278" cy="150" r="3" fill="#7A4B3A" opacity="0.35" />

          {/* 左侧角色卡片 */}
          <rect x="50" y="108" width="52" height="42" rx="7" fill="#fff" stroke="url(#accent-worldbook)" strokeWidth="1.5" />
          <circle cx="76" cy="123" r="7" fill="#7A4B3A" opacity="0.18" />
          <line x1="62" y1="136" x2="90" y2="136" stroke="#7A4B3A" strokeWidth="1" opacity="0.2" />
          <line x1="65" y1="143" x2="87" y2="143" stroke="#7A4B3A" strokeWidth="1" opacity="0.15" />
          <path d="M102 130 Q 115 150, 125 170" stroke="#7A4B3A" strokeWidth="1" strokeDasharray="2 2" opacity="0.22" fill="none" />

          {/* 右侧角色卡片 */}
          <rect x="378" y="158" width="52" height="42" rx="7" fill="#fff" stroke="url(#accent-worldbook)" strokeWidth="1.5" />
          <circle cx="404" cy="173" r="7" fill="#7A4B3A" opacity="0.18" />
          <line x1="390" y1="186" x2="418" y2="186" stroke="#7A4B3A" strokeWidth="1" opacity="0.2" />
          <line x1="393" y1="193" x2="415" y2="193" stroke="#7A4B3A" strokeWidth="1" opacity="0.15" />
          <path d="M378 180 Q 365 150, 345 115" stroke="#7A4B3A" strokeWidth="1" strokeDasharray="2 2" opacity="0.22" fill="none" />

          {/* 装饰粒子 */}
          {[[40, 260], [440, 250], [45, 75], [435, 85], [165, 130], [345, 200], [75, 305], [400, 305]].map((pos, i) => (
            <circle key={`p-${i}`} cx={pos[0]} cy={pos[1]} r="1.5" fill="#7A4B3A" opacity="0.22" />
          ))}

          {/* 底部标签 */}
          <rect x="165" y="282" width="150" height="22" rx="11" fill="#7A4B3A" opacity="0.08" />
          <text x="240" y="296" textAnchor="middle" fontSize="10" fill="#7A4B3A" opacity="0.55" fontWeight="600">
            WORLD BUILDING
          </text>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
